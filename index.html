<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron Ledger</title>
<meta name="description" content="A workout log for the gym floor: pick the day, build the session, beat last time.">
<meta name="theme-color" content="#EEF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1015" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Iron Ledger">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --bg:#EEF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --line:#DCE0E6; --line-2:#C4CBD4;
  --ink:#151A21; --ink-2:#4A5461; --ink-3:#79838F;
  --accent:#B4522A; --accent-ink:#FFFFFF; --accent-soft:#F7E6DE; --accent-line:#E2BEAE;
  --good:#2C6B58; --good-soft:#E0EEE9;
  --warn:#9E3242;
  --shadow:0 1px 2px rgba(16,20,26,.06),0 4px 14px rgba(16,20,26,.05);
  --shadow-lg:0 -8px 30px rgba(16,20,26,.18);
  --ease:cubic-bezier(.22,.85,.26,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1015; --surface:#161B22; --surface-2:#1C222B; --line:#272E38; --line-2:#3A434F;
    --ink:#EDF0F4; --ink-2:#A8B2BF; --ink-3:#77818E;
    --accent:#D9744A; --accent-ink:#190E08; --accent-soft:#2E1C13; --accent-line:#4A2C1D;
    --good:#5FB79B; --good-soft:#152A21;
    --warn:#D46476;
    --shadow:0 1px 2px rgba(0,0,0,.42),0 6px 18px rgba(0,0,0,.32);
    --shadow-lg:0 -8px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#161B22; --surface-2:#1C222B; --line:#272E38; --line-2:#3A434F;
  --ink:#EDF0F4; --ink-2:#A8B2BF; --ink-3:#77818E;
  --accent:#D9744A; --accent-ink:#190E08; --accent-soft:#2E1C13; --accent-line:#4A2C1D;
  --good:#5FB79B; --good-soft:#152A21;
  --warn:#D46476;
  --shadow:0 1px 2px rgba(0,0,0,.42),0 6px 18px rgba(0,0,0,.32);
  --shadow-lg:0 -8px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;-webkit-appearance:none}
img{max-width:100%}
[hidden]{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

#app{display:flex;flex-direction:column;height:100%}

/* ---------------- header ---------------- */
header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  padding:9px 14px;display:flex;align-items:center;gap:10px}
.mark{font-weight:800;letter-spacing:.15em;text-transform:uppercase;font-size:10.5px;color:var(--ink-3)}
.mark b{color:var(--accent)}
.hgrow{flex:1}
.hnote{font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.themebtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none;
  transition:transform .18s var(--ease),border-color .18s,color .18s}
.themebtn:active{transform:scale(.9)}
.themebtn svg{width:17px;height:17px}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 108px}
.wrap{max-width:560px;margin:0 auto}
body.has-savebar main{padding-bottom:172px}

h1{font-size:23px;line-height:1.18;font-weight:800;letter-spacing:-.022em;margin:2px 0 4px;text-wrap:balance}
.sub{color:var(--ink-2);font-size:13.5px;margin:0 0 18px}
h2{font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 10px}

/* ---------------- animation ---------------- */
@keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:scale(.97);margin-bottom:-6px;max-height:0}}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes paneNext{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes paneBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.anim-view{animation:viewIn .24s var(--ease)}
.anim-card{animation:cardIn .3s var(--ease)}
.leaving{animation:cardOut .22s var(--ease) forwards;overflow:hidden}
.stagger>*{animation:cardIn .34s var(--ease) backwards}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

/* ---------------- day picker ---------------- */
.datefield{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:11px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.datefield label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.datefield input{flex:1;border:none;background:none;text-align:right;font-weight:600;font-size:15px;min-width:0}
.daygrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.daybtn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;
  text-align:left;box-shadow:var(--shadow);
  transition:transform .16s var(--ease),border-color .16s,box-shadow .16s}
.daybtn:active{transform:scale(.97)}
.daybtn .dn{font-weight:700;font-size:16px;letter-spacing:-.01em;display:block}
.daybtn .dm{font-size:11px;color:var(--ink-3);margin-top:3px;display:block;line-height:1.35}
.daybtn.wide{grid-column:1/-1}

/* ---------------- session ---------------- */
.sesshead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.sesshead .t{flex:1}
.kicker{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.linkbtn{font-size:12.5px;color:var(--ink-3);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.linkbtn:active{color:var(--warn)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;margin-bottom:11px;
  overflow:hidden;box-shadow:var(--shadow)}
.chead{padding:11px 12px 10px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
.gtile{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);
  border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;flex:none}
.gtile svg{width:23px;height:23px}
.cheadmain{flex:1;min-width:0}
.exname{font-weight:700;font-size:15.5px;letter-spacing:-.01em;text-align:left;display:flex;align-items:center;
  gap:6px;width:100%;line-height:1.25}
.exname .caret{color:var(--ink-3);font-size:10px;flex:none}
.metarow{display:flex;align-items:center;gap:7px;margin-top:6px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--ink-2)}
.chip.tap{border-style:dashed;transition:border-color .16s,color .16s}
.chip.tap:active{border-color:var(--accent);color:var(--accent)}
.chip.muscle{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.last{font-size:12px;color:var(--ink-2);margin-top:8px;display:flex;align-items:center;gap:6px;padding:0 12px 10px}
.last b{font-weight:600}
.last .dot{width:5px;height:5px;border-radius:50%;background:var(--good);flex:none}
.last.none{color:var(--ink-3)}
.last.none .dot{background:var(--line-2)}

table.sets{width:100%;border-collapse:collapse;border-top:1px solid var(--line)}
table.sets th{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  padding:6px 4px 5px;text-align:center;border-bottom:1px solid var(--line)}
table.sets th:first-child{width:30px}
table.sets th:last-child{width:34px}
table.sets td{padding:0;border-bottom:1px solid var(--line);vertical-align:middle}
table.sets td>*{display:block}
table.sets tbody tr:last-child td{border-bottom:none}
.setno{text-align:center;font-size:12px;font-weight:600;color:var(--ink-3)}
.cellin{width:100%;height:48px;line-height:48px;padding:0 2px;border:none;background:none;text-align:center;
  font-size:16px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:0;
  border-radius:0;transition:background .15s}
.cellin::placeholder{color:var(--line-2);font-weight:500}
.cellin:focus{outline:none;background:var(--accent-soft)}
.rirbtn{width:100%;height:48px;line-height:48px;padding:0;text-align:center;font-size:15px;font-weight:600;
  font-family:var(--mono);color:var(--ink-2);transition:background .15s}
.rirbtn.norir{color:var(--line-2)}
.rirbtn:active{background:var(--surface-2)}
.xbtn{width:100%;height:48px;line-height:48px;padding:0;text-align:center;color:var(--line-2);font-size:15px}
.xbtn:active{color:var(--warn)}
.cfoot{display:flex;border-top:1px solid var(--line);background:var(--surface-2)}
.cfoot button{flex:1;padding:10px;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:color .16s}
.cfoot button+button{border-left:1px solid var(--line)}
.cfoot button:active{color:var(--accent)}
.cfoot button.danger:active{color:var(--warn)}

.addex{width:100%;padding:15px;border:1.5px dashed var(--line-2);border-radius:14px;font-weight:600;
  font-size:14.5px;color:var(--ink-2);background:var(--surface-2);display:flex;align-items:center;
  justify-content:center;gap:8px;transition:transform .16s var(--ease),border-color .16s,color .16s}
.addex:active{transform:scale(.98);border-color:var(--accent);color:var(--accent)}
.addex svg{width:17px;height:17px}

.blank{text-align:center;padding:26px 18px 30px;color:var(--ink-3);border:1.5px dashed var(--line);
  border-radius:14px;margin-bottom:12px;background:var(--surface-2)}
.blank .bt{font-weight:700;color:var(--ink-2);font-size:14px;margin-bottom:5px}
.blank p{margin:0;font-size:12.5px;line-height:1.5;max-width:270px;margin-inline:auto}

.quick{margin-bottom:12px}
.quicklabel{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin-bottom:8px}
.quickrow{display:flex;flex-wrap:wrap;gap:7px}
.qchip{display:flex;align-items:center;gap:7px;padding:8px 12px 8px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2);
  box-shadow:var(--shadow);transition:transform .16s var(--ease),border-color .16s,color .16s}
.qchip:active{transform:scale(.96);border-color:var(--accent);color:var(--accent)}
.qchip svg{width:15px;height:15px;color:var(--accent);flex:none}

/* ---------------- save bar + nav ---------------- */
.savebar{position:fixed;left:0;right:0;z-index:25;bottom:calc(53px + env(safe-area-inset-bottom,0px));
  padding:14px 16px 10px;background:linear-gradient(to top,var(--bg) 58%,transparent);pointer-events:none}
.savebar .inner{max-width:560px;margin:0 auto;display:flex;gap:9px}
.savebar .inner>*{pointer-events:auto}
.primary{flex:1;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:15px;
  font-weight:700;font-size:15.5px;box-shadow:var(--shadow);
  transition:transform .16s var(--ease),opacity .2s}
.primary:active{transform:scale(.985)}
.primary:disabled{opacity:.42}
.primary .n{font-weight:500;opacity:.85}

nav{position:fixed;left:0;right:0;bottom:0;z-index:28;display:flex;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:8px 4px 7px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .18s}
nav button svg{width:19px;height:19px;transition:transform .2s var(--ease)}
nav button[aria-current="true"]{color:var(--accent)}
nav button[aria-current="true"] svg{transform:translateY(-1px) scale(1.06)}

/* ---------------- log ---------------- */
.logrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;
  overflow:hidden;box-shadow:var(--shadow)}
.logtop{width:100%;display:flex;align-items:center;gap:12px;padding:13px;transition:background .16s}
.logtop:active{background:var(--surface-2)}
.logdate{text-align:left;flex:1;min-width:0}
.logdate .d{font-weight:700;font-size:15px}
.logdate .m{font-size:12px;color:var(--ink-3);margin-top:1px}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;
  border-radius:999px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);flex:none}
.logbody{padding:0 13px 12px;border-top:1px solid var(--line);animation:viewIn .22s var(--ease)}
.lex{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.lex:last-of-type{border-bottom:none}
.lex .n{font-weight:600;font-size:13.5px;flex:1;min-width:0}
.lex .s{font-size:12.5px;color:var(--ink-2);text-align:right}

/* ---------------- progress ---------------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 11px;
  box-shadow:var(--shadow)}
.stat .v{font-size:25px;font-weight:800;letter-spacing:-.025em;font-family:var(--mono);line-height:1.1}
.stat .k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2px 13px;box-shadow:var(--shadow)}
.bars{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 13px 9px;
  box-shadow:var(--shadow)}
.bar{display:grid;grid-template-columns:74px 1fr 26px;align-items:center;gap:9px;padding:4px 0}
.bar .bl{font-size:12px;color:var(--ink-2);font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.track{position:relative;height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px;
  animation:growBar .5s var(--ease) backwards}
@keyframes growBar{from{width:0!important}}
.fill.ok{background:var(--good)}
.target{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--line-2)}
.bar .bv{font-size:12.5px;font-weight:600;text-align:right;font-family:var(--mono)}
.legendnote{font-size:11.5px;color:var(--ink-3);margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:6px}
.swatch{width:9px;height:9px;border-radius:2px;background:var(--good);flex:none}
.pbrow{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pbrow:last-child{border-bottom:none}
.pbrow .n{flex:1;font-size:13.5px;font-weight:600;min-width:0}
.pbrow .v{font-size:13.5px;font-weight:700;font-family:var(--mono)}
.pbrow .e{font-size:11px;color:var(--ink-3);width:60px;text-align:right}
.datarow{display:flex;gap:8px}
.databtn{flex:1;padding:12px 8px;border:1px solid var(--line-2);border-radius:11px;font-size:13px;font-weight:600;
  color:var(--ink-2);background:var(--surface-2);transition:transform .16s var(--ease),border-color .16s,color .16s}
.databtn:active{transform:scale(.97);border-color:var(--accent);color:var(--accent)}
.seg{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:4px}
.seg button{flex:1;padding:9px 6px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);
  transition:background .18s,color .18s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.empty svg{width:40px;height:40px;margin:0 auto 12px;opacity:.45}
.empty p{margin:0;font-size:13.5px;max-width:280px;margin-inline:auto;line-height:1.5}

.banner{display:flex;align-items:center;gap:11px;background:var(--accent-soft);border:1px solid var(--accent-line);
  border-radius:13px;padding:11px 12px;margin-bottom:14px;animation:cardIn .3s var(--ease)}
.banner .bx{flex:1;min-width:0}
.banner .bt{font-size:13px;font-weight:700;color:var(--accent)}
.banner .bs{font-size:11.5px;color:var(--ink-2);margin-top:2px;line-height:1.4}
.banner .ba{flex:none;display:flex;gap:6px}
.banner button{padding:7px 11px;border-radius:9px;font-size:12px;font-weight:700;background:var(--accent);
  color:var(--accent-ink)}
.banner button.ghost{background:none;color:var(--ink-3);font-weight:600}

/* ---------------- sheet / picker ---------------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(6,9,13,.5);display:flex;align-items:flex-end;
  animation:scrimIn .2s ease;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scrim.closing{animation:scrimIn .2s ease reverse forwards}
.sheet{background:var(--surface);width:100%;max-height:90%;border-radius:20px 20px 0 0;display:flex;
  flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);max-width:560px;margin:0 auto;
  box-shadow:var(--shadow-lg);animation:sheetUp .3s var(--ease);overflow:hidden}
.scrim.closing .sheet{animation:sheetUp .24s var(--ease) reverse forwards}
.grab{width:36px;height:4px;border-radius:3px;background:var(--line-2);margin:8px auto 0;flex:none}
.shead{padding:11px 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex:none}
.shead .st{font-weight:700;font-size:16px;flex:1;min-width:0;letter-spacing:-.01em}
.backb{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;color:var(--ink-2);flex:none;transition:transform .16s var(--ease)}
.backb:active{transform:scale(.9)}
.backb svg{width:16px;height:16px}
.search{margin:10px 14px 2px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;width:calc(100% - 28px);font-size:16px;flex:none}
.search:focus{outline:none;border-color:var(--accent)}
.slist{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 20px;flex:1}
.slist.next{animation:paneNext .26s var(--ease)}
.slist.back{animation:paneBack .26s var(--ease)}

.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbox{aspect-ratio:1/1;border:1px solid var(--line);border-radius:16px;background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:12px;
  text-align:center;transition:transform .17s var(--ease),border-color .17s,background .17s;
  animation:popIn .3s var(--ease) backwards}
.mbox:active{transform:scale(.955);border-color:var(--accent);background:var(--accent-soft)}
.mbox .art{width:56px;height:56px;color:var(--accent)}
.mbox .art svg{width:100%;height:100%}
.mbox .mn{font-weight:700;font-size:13.5px;letter-spacing:-.01em;line-height:1.2}
.mbox .mc{font-size:10.5px;color:var(--ink-3);font-weight:600}

.egrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ebox{border:1px solid var(--line);border-radius:14px;background:var(--surface-2);padding:12px 10px 11px;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-height:118px;
  justify-content:flex-start;transition:transform .17s var(--ease),border-color .17s,background .17s;
  animation:popIn .28s var(--ease) backwards}
.ebox:active{transform:scale(.96);border-color:var(--accent);background:var(--accent-soft)}
.ebox.sel{border-color:var(--accent);background:var(--accent-soft)}
.ebox .eart{width:38px;height:38px;color:var(--accent);flex:none}
.ebox .eart svg{width:100%;height:100%}
.ebox .en{font-size:12.5px;font-weight:650;line-height:1.28;letter-spacing:-.01em}
.ebox .el{font-size:10px;color:var(--ink-3);font-weight:600;margin-top:auto}
.sgroup{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  padding:14px 2px 7px}
.sgroup:first-child{padding-top:2px}
.rirgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 14px 22px}
.rirgrid button{padding:15px 6px;border:1px solid var(--line);border-radius:12px;font-weight:700;font-size:17px;
  font-family:var(--mono);transition:transform .16s var(--ease),background .16s;
  animation:popIn .26s var(--ease) backwards}
.rirgrid button:active{transform:scale(.95)}
.rirgrid button small{display:block;font-family:var(--ui);font-size:10px;font-weight:600;color:var(--ink-3);margin-top:3px}
.rirgrid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rirgrid button[aria-pressed="true"] small{color:var(--accent-ink);opacity:.82}
.loadlist button{width:100%;text-align:left;padding:12px;border-radius:11px;display:flex;align-items:center;gap:11px;
  transition:background .16s}
.loadlist button:active{background:var(--surface-2)}
.loadlist button.sel{background:var(--accent-soft)}
.loadlist .li{width:30px;height:30px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.loadlist .li svg{width:18px;height:18px}
.hint{font-size:12.5px;color:var(--ink-2);line-height:1.55;padding:4px 4px 8px}
.formlab{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  padding:16px 2px 8px}
.formlab:first-child{padding-top:2px}
.chipgrid{display:flex;flex-wrap:wrap;gap:7px}
.mchip{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);
  font-size:12.5px;font-weight:600;color:var(--ink-2);
  transition:transform .15s var(--ease),background .16s,border-color .16s,color .16s}
.mchip:active{transform:scale(.95)}
.mchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.newbtn{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:13px;padding:15px;
  font-weight:700;font-size:15px;margin-top:18px;transition:transform .16s var(--ease),opacity .2s}
.newbtn:active{transform:scale(.985)}
.newbtn:disabled{opacity:.4}
.yours{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px}
.yours .yn{flex:1;font-weight:600;min-width:0}
.yours .ym{font-size:11px;color:var(--ink-3)}
.yours button{color:var(--line-2);font-size:17px;padding:0 6px;line-height:1}
.yours button:active{color:var(--warn)}
.ebox.new{border-style:dashed;justify-content:center;color:var(--ink-2)}
.ebox.new .eart{width:26px;height:26px}

.toast{position:fixed;left:16px;right:16px;bottom:calc(122px + env(safe-area-inset-bottom,0px));z-index:70;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 15px;font-size:13.5px;font-weight:600;
  max-width:528px;margin:0 auto;box-shadow:var(--shadow);text-align:center;animation:toastIn .26s var(--ease)}
</style>
</head>

};

/* ========================= exercise library ========================= */
var BB="Barbell (incl. bar)",EZ="EZ bar (incl. bar)",SM="Smith (incl. bar)",DBH="Dumbbell (per hand)",

LOADGEAR[BB]="bar";LOADGEAR[EZ]="bar";LOADGEAR[SM]="bar";LOADGEAR[DBH]="db";LOADGEAR[DBT]="db";
LOADGEAR[MS]="machine";LOADGEAR[CS]="cable";LOADGEAR[CPS]="cable";LOADGEAR[PL]="plates";
LOADGEAR[BW]="body";LOADGEAR[BWA]="body";LOADGEAR[CARD]="cardio";LOADGEAR[BAND]="band";
function gearFor(load){return GEAR[LOADGEAR[load]||"machine"];}

var LIB=[
["Flat Barbell Bench Press","Chest",BB],["Incline Barbell Press","Chest",BB],

["Iso-Lateral Machine Pulldown","Back",MS],["Seated Cable Row (neutral)","Back",CS],

["Barbell Back Squat (free)","Quads",BB],["Leg Press","Quads",MS],["Single-Leg Press","Quads",MS],
["Leg Extension","Quads",MS],["Bulgarian Split Squat (DB)","Quads",DBH],
["Walking Lunge (DB)","Quads",DBH],["Goblet Squat","Quads",DBT],

["Abs Crunch Machine","Abs",MS],["Cable Crunch","Abs",CS],["Lying Leg Raise","Abs",BW],
["Hanging Leg Raise","Abs",BW],["Plank (log seconds)","Abs",BW],["Russian Twist","Abs",DBT],
["Treadmill Run","Cardio",CARD],["Treadmill Incline Walk","Cardio",CARD],
["Stationary Bike","Cardio",CARD],["Elliptical","Cardio",CARD],["Stair Master","Cardio",CARD],
["Rowing Machine","Cardio",CARD],["Jump Rope","Cardio",BW],["HIIT Intervals","Cardio",CARD]
];
var BY_NAME={}; LIB.forEach(function(e){BY_NAME[e[0]]={muscle:e[1],load:e[2]};});

var MUSCLE_ORDER=["Chest","Back","Traps","Shoulders","Side Delts","Rear Delts","Biceps","Triceps",
  "Forearms","Quads","Hamstrings","Glutes","Calves","Abs","Cardio"];

/* ---- exercises she adds herself ---- */
var CUSTOM_KEY="ironledger.custom.v3";
var customs=[];                       /* [name, muscle, load] */
function ALLEX(){ return LIB.concat(customs); }
function isCustom(n){
  for(var i=0;i<customs.length;i++) if(customs[i][0]===n) return true;
  return false;
}
function metaFor(n){
  if(BY_NAME[n]) return BY_NAME[n];
  for(var i=0;i<customs.length;i++) if(customs[i][0]===n) return {muscle:customs[i][1],load:customs[i][2]};
  return {muscle:"Chest",load:MS};
}
function saveCustoms(){ lsSet(CUSTOM_KEY,customs); }
function addCustom(name,muscle,load){
  name=String(name||"").replace(/\s+/g," ").trim().slice(0,60);
  if(!name) return null;
  var all=ALLEX();
  for(var i=0;i<all.length;i++) if(all[i][0].toLowerCase()===name.toLowerCase()) return all[i][0];
  if(MUSCLE_ORDER.indexOf(muscle)<0) muscle="Chest";
  if(LOADS.indexOf(load)<0) load=MS;
  customs.push([name,muscle,load]); saveCustoms();
  return name;
}
function removeCustom(name){
  customs=customs.filter(function(e){return e[0]!==name;}); saveCustoms();
}
function countIn(m){var n=0;ALLEX().forEach(function(e){if(e[1]===m)n++;});return n;}

var state={tab:"today",draft:null,sessions:[],open:{},meta:{backedUpAt:null,backedUpCount:0,snoozeAt:0},
           theme:"auto",justAdded:null};

function lsGet(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

function todayISO(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function fmtDate(iso){if(!iso)return"";var p=String(iso).split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);
  return isNaN(d)?iso:d.toLocaleDateString(undefined,{day:"numeric",month:"short"});}
function fmtLong(iso){
  var p=String(iso).split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);
  if(isNaN(d))return iso;
  if(iso===todayISO())return "Today";
  var y=new Date(Date.now()-864e5);
  if(iso===new Date(y.getTime()-y.getTimezoneOffset()*6e4).toISOString().slice(0,10))return "Yesterday";
  return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
}
function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function num(v){var n=parseFloat(v);return isFinite(n)?n:null;}

/* ========================= theme ========================= */
function applyTheme(){
  var r=document.documentElement;
  if(state.theme==="auto") r.removeAttribute("data-theme");
  else r.setAttribute("data-theme",state.theme);
  var b=document.getElementById("themeBtn");
  b.innerHTML = state.theme==="light"?ICON.sun : state.theme==="dark"?ICON.moon : ICON.auto;
  b.setAttribute("aria-label","Theme: "+state.theme+". Tap to change.");
}
function cycleTheme(){
  state.theme = state.theme==="auto"?"light" : state.theme==="light"?"dark" : "auto";
  lsSet(THEME_KEY,state.theme); applyTheme();
  toast(state.theme==="auto"?"Theme follows your phone":state.theme==="light"?"Light mode":"Dark mode");
}

/* ========================= draft ========================= */
function newExercise(name){
  var meta=metaFor(name);
  return {id:uid(),name:name,muscle:meta.muscle,load:meta.load,sets:[blank(),blank(),blank()]};
}
function blank(){return {kg:"",reps:"",rir:""};}
function startSession(dayKey,dateISO){
  state.draft={id:uid(),day:dayKey,date:dateISO,exercises:[]};
  saveDraft(); render();
}
function saveDraft(){ if(state.draft) lsSet(DRAFT_KEY,state.draft); else lsDel(DRAFT_KEY); }
function countSets(d){
  var n=0;(d.exercises||[]).forEach(function(e){
    (e.sets||[]).forEach(function(s){ if(num(s.reps)>0) n++; });});
  return n;
}

/* ========================= history ========================= */
function sortedSessions(){
  return state.sessions.slice().sort(function(a,b){
    return a.date===b.date?(b.createdAt||0)-(a.createdAt||0):(a.date<b.date?1:-1);});
}
function lastTimeFor(name,skipId){
  var list=sortedSessions();
  for(var i=0;i<list.length;i++){
    var s=list[i]; if(s.id===skipId) continue;
    for(var j=0;j<(s.exercises||[]).length;j++){
      var e=s.exercises[j]; if(e.name!==name) continue;
      var best=null;
      (e.sets||[]).forEach(function(st){
        var kg=num(st.kg),rp=num(st.reps); if(rp===null||rp<=0) return;
        var w=kg===null?0:kg;
        if(!best||w>best.kg||(w===best.kg&&rp>best.reps)) best={kg:w,reps:rp};
      });
      if(best) return {kg:best.kg,reps:best.reps,date:s.date};
    }
  }
  return null;
}
function quickAddsFor(dayKey,already){
  var tally={};
  state.sessions.forEach(function(s){
    if(s.day!==dayKey) return;
    (s.exercises||[]).forEach(function(e){ tally[e.name]=(tally[e.name]||0)+1; });
  });
  return Object.keys(tally)
    .filter(function(n){return already.indexOf(n)<0;})
    .sort(function(a,b){return tally[b]-tally[a]||a.localeCompare(b);})
    .slice(0,4);
}
function weekStart(iso){
  var p=String(iso).split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
}
function setsThisWeek(){
  var wk=weekStart(todayISO()),out={};
  state.sessions.forEach(function(s){
    if(weekStart(s.date)!==wk) return;
    (s.exercises||[]).forEach(function(e){
      var n=0;(e.sets||[]).forEach(function(st){ if(num(st.reps)>0) n++; });
      if(n) out[e.muscle]=(out[e.muscle]||0)+n;
    });
  });
  return out;
}
function personalBests(){
  var pb={};
  state.sessions.forEach(function(s){
    (s.exercises||[]).forEach(function(e){
      (e.sets||[]).forEach(function(st){
        var kg=num(st.kg),rp=num(st.reps);
        if(rp===null||rp<=0||kg===null||kg<=0) return;
        var e1=kg*(1+rp/30);
        if(!pb[e.name]||e1>pb[e.name].e1) pb[e.name]={kg:kg,reps:rp,e1:e1,date:s.date};
      });
    });
  });
  return Object.keys(pb).map(function(k){return {name:k,d:pb[k]};})
    .sort(function(a,b){return b.d.e1-a.d.e1;});
}

/* ========================= persistence (this device only) ========================= */
function bootData(){
  state.sessions=lsGet(LOCAL_KEY,[]);
  state.meta=lsGet(META_KEY,{backedUpAt:null,backedUpCount:0,snoozeAt:0});
  var cs=lsGet(CUSTOM_KEY,[]);
  customs=Array.isArray(cs)?cs.filter(function(e){return Array.isArray(e)&&e.length===3&&e[0];}):[];
  if(navigator.storage&&navigator.storage.persist){ try{navigator.storage.persist();}catch(e){} }
}
function writeAll(list){ state.sessions=list; return lsSet(LOCAL_KEY,list); }
function persistSession(s){
  var all=lsGet(LOCAL_KEY,[]); all.push(s);
  if(!writeAll(all)) return Promise.reject(new Error("storage"));
  return Promise.resolve();
}
function removeSession(id){
  writeAll(lsGet(LOCAL_KEY,[]).filter(function(s){return s.id!==id;}));
  return Promise.resolve();
}
function backupDue(){
  var since=state.sessions.length-(state.meta.backedUpCount||0);
  if(since<BACKUP_EVERY) return false;
  return state.sessions.length>(state.meta.snoozeAt||0)+BACKUP_EVERY-1 ?
         state.sessions.length-(state.meta.snoozeAt||0)>=BACKUP_EVERY : false;
}
function exportBackup(){
  var sessions=lsGet(LOCAL_KEY,[]);
  var payload={app:"iron-ledger",format:2,exported:new Date().toISOString(),
               count:sessions.length,sessions:sessions,custom:customs};
  var blob=new Blob([JSON.stringify(payload,null,1)],{type:"application/json"});
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url; a.download="iron-ledger-backup-"+todayISO()+".json"; a.rel="noopener";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
  state.meta.backedUpAt=new Date().toISOString();
  state.meta.backedUpCount=sessions.length;
  lsSet(META_KEY,state.meta);
  toast(sessions.length+" workout"+(sessions.length===1?"":"s")+" exported");
  render();
}
function importBackup(file){
  var r=new FileReader();
  r.onload=function(){
    var data;
    try{ data=JSON.parse(r.result); }catch(e){ toast("That file isn't a valid backup"); return; }
    var incoming=(data&&Array.isArray(data.sessions))?data.sessions:(Array.isArray(data)?data:null);
    if(!incoming||!incoming.length){ toast("No workouts found in that file"); return; }
    var all=lsGet(LOCAL_KEY,[]),have={},added=0;
    all.forEach(function(s){have[s.id]=true;});
    incoming.forEach(function(s){
      if(!s||!s.id||have[s.id]) return;
      if(!s.date||!Array.isArray(s.exercises)) return;
      all.push(s); have[s.id]=true; added++;
    });
    if(!writeAll(all)){ toast("Not enough storage to restore"); return; }
    if(Array.isArray(data.custom)){
      data.custom.forEach(function(c){
        if(Array.isArray(c)&&c.length===3&&c[0]) addCustom(c[0],c[1],c[2]);
      });
    }
    state.meta.backedUpCount=all.length; lsSet(META_KEY,state.meta);
    render(); toast(added?added+" workout"+(added===1?"":"s")+" restored":"Already up to date");
  };
  r.onerror=function(){ toast("Could not read that file"); };
  r.readAsText(file);
}

    '<div class="bs">'+since+' workouts since your last export. It only lives on this phone.</div></div>'+
    '<div class="ba"><button data-act="export">Export</button>'+

/* ---------- log ---------- */
function renderLog(){
  var bar=document.getElementById("savebar"); if(bar) bar.remove();
  var list=sortedSessions();
  if(!list.length){
    view.innerHTML='<h1>Log</h1><div class="empty">'+NAVART.log+
      '<p>Saved workouts land here. Finish one on the Today tab and it shows up.</p></div>';
    return;
  }
  var h=backupBanner();
  h+='<h1>Log</h1><p class="sub">'+list.length+' workout'+(list.length===1?"":"s")+' saved. Tap one to see the sets.</p>';
  list.forEach(function(s){
    var sets=countSets(s),vol=0;
    (s.exercises||[]).forEach(function(e){(e.sets||[]).forEach(function(st){
      var kg=num(st.kg),rp=num(st.reps); if(kg&&rp) vol+=kg*rp;});});
    h+='<div class="logrow"><button class="logtop" data-act="toggle" data-id="'+s.id+'">'+
       '<span class="logdate"><span class="d">'+esc(fmtLong(s.date))+'</span>'+
       '<span class="m">'+sets+' sets · '+(vol?Math.round(vol).toLocaleString()+' kg lifted':'bodyweight')+'</span></span>'+
       '<span class="badge">'+esc(s.day)+'</span></button>';
    if(state.open[s.id]){
      h+='<div class="logbody">';
      (s.exercises||[]).forEach(function(e){
        var done=(e.sets||[]).filter(function(st){return num(st.reps)>0;});
        if(!done.length) return;
        h+='<div class="lex"><span class="n">'+esc(e.name)+'</span><span class="s num">'+
           done.map(function(st){var kg=num(st.kg);
             return (kg?kg:"BW")+"×"+num(st.reps)+(st.rir!==""&&st.rir!=null?'<span style="opacity:.5"> @'+esc(st.rir)+'</span>':"");
           }).join(" &nbsp;")+'</span></div>';
      });
      h+='<div style="padding-top:10px"><button class="linkbtn" data-act="delsession" data-id="'+s.id+'">Delete this workout</button></div></div>';
    }
    h+='</div>';
  });
  view.innerHTML=h;
}

function renderProgress(){
  var bar=document.getElementById("savebar"); if(bar) bar.remove();
  var h="";
  if(!state.sessions.length){
    h+='<h1>Progress</h1><div class="empty">'+NAVART.progress+
       '<p>Once a few workouts are saved, weekly volume and best lifts appear here.</p></div>'+dataPanel();
    view.innerHTML=h; return;
  }
  var wk=setsThisWeek(),ws=weekStart(todayISO()),total=0;
  Object.keys(wk).forEach(function(k){total+=wk[k];});
  var sess=state.sessions.filter(function(s){return weekStart(s.date)===ws;}).length;
  var muscles=MUSCLE_ORDER.filter(function(m){return wk[m];});
  var max=Math.max(20,Math.max.apply(null,muscles.map(function(m){return wk[m];}).concat([0])));

  h+=backupBanner();
  h+='<h1>Progress</h1><p class="sub">Week of '+esc(fmtDate(ws))+'</p>';
  h+='<div class="stats"><div class="stat"><div class="v">'+sess+'</div><div class="k">Sessions</div></div>'+
     '<div class="stat"><div class="v">'+total+'</div><div class="k">Working sets</div></div>'+
     '<div class="stat"><div class="v">'+muscles.length+'</div><div class="k">Muscles hit</div></div></div>';

  h+='<h2>Sets per muscle, this week</h2>';
  if(!muscles.length){
    h+='<div class="panel" style="padding:18px 13px"><div style="color:var(--ink-3);font-size:13px">Nothing logged this week yet.</div></div>';
  }else{
    h+='<div class="bars">';
    muscles.forEach(function(m,i){
      var v=wk[m],pct=Math.min(100,v/max*100),ok=v>=10&&v<=20;
      h+='<div class="bar"><span class="bl">'+esc(m)+'</span><span class="track">'+
         '<span class="fill'+(ok?" ok":"")+'" style="width:'+pct.toFixed(1)+'%;animation-delay:'+(i*45)+'ms"></span>'+
         '<span class="target" style="left:'+(10/max*100).toFixed(1)+'%"></span></span>'+
         '<span class="bv">'+v+'</span></div>';
    });
    h+='<div class="legendnote"><span class="swatch"></span>Green once a muscle is in the 10–20 set range. '+
       'The tick marks 10.</div></div>';
  }

  var pb=personalBests().slice(0,12);
  if(pb.length){
    h+='<h2>Best sets</h2><div class="panel">';
    pb.forEach(function(p){
      h+='<div class="pbrow"><span class="n">'+esc(p.name)+'</span>'+
         '<span class="v">'+p.d.kg+' × '+p.d.reps+'</span>'+
         '<span class="e">'+esc(fmtDate(p.d.date))+'</span></div>';
    });
    h+='</div>';
  }
  h+=dataPanel();
  view.innerHTML=h;
}

  sc.classList.add("closing");
  clearTimeout(sheetClose);
  sheetClose=setTimeout(function(){sheetHost.innerHTML="";},250);
}

  sheetHost.innerHTML='<div class="scrim"><div class="sheet"><div class="grab"></div>'+inner+'</div></div>';
  return sheetHost.querySelector(".sheet");
}

/* ---- exercise picker: muscle boxes -> exercises ---- */
function exerciseSheet(idx){
  var d=state.draft,day=DAY_BY[d.day]||DAY_BY.Custom;
  var mode="groups",group=null,q="",showAll=false,dir="next";
  var nName="",nMuscle=null,nLoad=MS;

  function pool(){ return ALLEX().filter(function(e){return showAll||day.m.indexOf(e[1])>=0;}); }

  function paint(){
    var body,head,search=true;

    if(mode==="new"){
      search=false;
      head=headHTML(true,"Your own exercise");
      body='<div class="formlab">What is it called?</div>'+
        '<input class="search" id="newName" style="margin:0;width:100%" placeholder="e.g. Landmine Press" '+
        'value="'+esc(nName)+'" maxlength="60" autocomplete="off" autocorrect="off" spellcheck="false">'+
        '<div class="formlab">Which muscle does it train?</div><div class="chipgrid">'+
        MUSCLE_ORDER.map(function(m){
          return '<button class="mchip" data-m="'+esc(m)+'" aria-pressed="'+(nMuscle===m)+'">'+esc(m)+'</button>';
        }).join("")+'</div>'+
        '<div class="formlab">How is it loaded?</div><div class="chipgrid">'+
        LOADS.map(function(l){
          return '<button class="mchip" data-l="'+esc(l)+'" aria-pressed="'+(nLoad===l)+'">'+esc(l)+'</button>';
        }).join("")+'</div>'+
        '<button class="newbtn" data-create'+((nName.trim()&&nMuscle)?"":" disabled")+'>'+
        (nMuscle?'Add '+esc(nName.trim()||"it")+' to today':'Pick a muscle group to continue')+'</button>'+
        '<div class="hint" style="padding-top:12px">It gets saved to your list, so next time it’s '+
        'already there under '+(nMuscle?esc(nMuscle):'its muscle group')+'.</div>'+
        (customs.length?'<div class="formlab">Exercises you’ve added</div>'+
          customs.map(function(c){
            return '<div class="yours"><span class="yn">'+esc(c[0])+'</span>'+
                   '<span class="ym">'+esc(c[1])+'</span>'+
                   '<button data-delcustom="'+esc(c[0])+'" aria-label="Delete '+esc(c[0])+'">×</button></div>';
          }).join(""):"");
    }
    else if(q){
      var ql=q.toLowerCase();
      var hits=pool().filter(function(e){return (e[0]+" "+e[1]).toLowerCase().indexOf(ql)>=0;});
      var exact=ALLEX().some(function(e){return e[0].toLowerCase()===ql.trim();});
      body=hits.length?'<div class="egrid">'+hits.map(tile).join("")+'</div>'
                      :'<div class="empty" style="padding:30px 20px"><p>Nothing matches “'+esc(q)+'”.</p></div>';
      body+='<div style="padding-top:14px;display:grid;gap:8px">';
      if(!exact&&q.trim())
        body+='<button class="databtn" data-new data-name="'+esc(q.trim())+'" style="width:100%">'+
              '＋  Add “'+esc(q.trim())+'” as your own exercise</button>';
      if(!showAll)
        body+='<button class="databtn" data-all style="width:100%">Search every exercise, not just '+esc(day.k)+'</button>';
      body+='</div>';
      head=headHTML(false,"Search");
    }
    else if(mode==="groups"){
      var groups=MUSCLE_ORDER.filter(function(m){ return showAll?countIn(m)>0:day.m.indexOf(m)>=0; });
      body='<div class="mgrid">'+groups.map(function(m,i){
        return '<button class="mbox" data-group="'+esc(m)+'" style="animation-delay:'+(i*26)+'ms">'+
               '<span class="art">'+(ART[m]||GEAR.machine)+'</span>'+
               '<span class="mn">'+esc(m)+'</span>'+
               '<span class="mc">'+countIn(m)+' exercises</span></button>';}).join("")+'</div>'+
        '<div style="padding-top:12px;display:grid;gap:8px">'+
        ((!showAll&&day.k!=="Custom")?'<button class="databtn" data-all style="width:100%">Show every muscle group</button>':'')+
        '<button class="databtn" data-new style="width:100%">＋  Add an exercise that isn’t listed</button></div>';
      head=headHTML(false,idx===null?"Add an exercise":"Change exercise");
    }
    else{
      var list=pool().filter(function(e){return e[1]===group;});
      body='<div class="egrid">'+list.map(tile).join("")+
           '<button class="ebox new" data-new data-group="'+esc(group)+'">'+
           '<span class="eart">'+ICON.plus+'</span><span class="en">Add your own '+esc(group)+' exercise</span>'+
           '</button></div>';
      head=headHTML(true,group);
    }

    var sheetEl=openSheet(head+
      (search?'<input class="search" id="exSearch" placeholder="Search exercises…" value="'+esc(q)+'" '+
      'autocomplete="off" autocorrect="off" spellcheck="false">':'')+
      '<div class="slist '+dir+'">'+body+'</div>');

    var si=sheetEl.querySelector("#exSearch");
    if(si) si.addEventListener("input",function(){
      q=si.value; var pos=si.selectionStart; dir="next"; paint();
      var nn=sheetHost.querySelector("#exSearch");
      if(nn){ nn.focus(); try{nn.setSelectionRange(pos,pos);}catch(e){} }
    });
    var ni=sheetEl.querySelector("#newName");
    if(ni){
      ni.addEventListener("input",function(){
        nName=ni.value;
        var btn=sheetHost.querySelector("[data-create]");
        if(btn){ btn.disabled=!(nName.trim()&&nMuscle);
          btn.textContent=nMuscle?("Add "+(nName.trim()||"it")+" to today"):"Pick a muscle group to continue"; }
      });
      ni.addEventListener("keydown",function(ev){
        if(ev.key==="Enter"&&nName.trim()&&nMuscle){ ev.preventDefault(); createNow(); }
      });
    }

    sheetEl.addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b) return;
      var live=sheetHost.querySelector("#newName"); if(live) nName=live.value;

      if(b.dataset.close!==undefined){ closeSheet(); return; }
      if(b.dataset.delcustom!==undefined){ removeCustom(b.dataset.delcustom); dir="next"; paint(); return; }
      if(b.dataset.back!==undefined){
        if(mode==="new"){ mode=group?"ex":"groups"; }
        else { mode="groups"; group=null; }
        dir="back"; paint(); return;
      }
      if(b.dataset.new!==undefined){
        mode="new"; dir="next";
        if(b.dataset.name) nName=b.dataset.name;
        if(b.dataset.group) nMuscle=b.dataset.group;
        else if(!nMuscle&&group) nMuscle=group;
        q=""; paint();
        var f=sheetHost.querySelector("#newName"); if(f&&!nName) f.focus();
        return;
      }
      if(b.dataset.m!==undefined){ nMuscle=b.dataset.m; dir="next"; paint(); return; }
      if(b.dataset.l!==undefined){ nLoad=b.dataset.l; dir="next"; paint(); return; }
      if(b.dataset.create!==undefined){ createNow(); return; }
      if(b.dataset.all!==undefined){ showAll=true; dir="next"; paint(); return; }
      if(b.dataset.group){ group=b.dataset.group; mode="ex"; dir="next"; paint(); return; }
      if(b.dataset.pick){ choose(b.dataset.pick); }
    });
  }

  function createNow(){
    var live=sheetHost.querySelector("#newName"); if(live) nName=live.value;
    if(!nName.trim()||!nMuscle) return;
    var saved=addCustom(nName,nMuscle,nLoad);
    if(!saved){ toast("Give it a name first"); return; }
    choose(saved);
  }

  function headHTML(back,title){
    return '<div class="shead">'+
      (back?'<button class="backb" data-back aria-label="Back">'+ICON.back+'</button>':'')+
      '<span class="st">'+esc(title)+'</span>'+
      '<button class="linkbtn" data-close>Close</button></div>';
  }
  function tile(e){
    var cur=idx===null?null:d.exercises[idx].name;
    return '<button class="ebox'+(e[0]===cur?" sel":"")+'" data-pick="'+esc(e[0])+'">'+
           '<span class="eart">'+gearFor(e[2])+'</span>'+
           '<span class="en">'+esc(e[0])+'</span>'+
           '<span class="el">'+(isCustom(e[0])?"Yours · ":"")+esc(e[2])+'</span></button>';
  }
  function choose(name){
    var meta=metaFor(name);
    if(idx===null){ var ex=newExercise(name); d.exercises.push(ex); state.justAdded=ex.id; }
    else{ d.exercises[idx].name=name; d.exercises[idx].muscle=meta.muscle; d.exercises[idx].load=meta.load; }
    saveDraft(); closeSheet(); render();
  }
  paint();
}

function loadSheet(idx){
  var ex=state.draft.exercises[idx];
  var body='<div class="loadlist">'+LOADS.map(function(l){
    return '<button class="'+(l===ex.load?"sel":"")+'" data-pick="'+esc(l)+'">'+
           '<span class="li">'+gearFor(l)+'</span><span>'+esc(l)+'</span></button>';}).join("")+'</div>'+
    '<div class="sgroup">What goes in the kg box</div>'+
    '<div class="hint">Barbell, EZ and Smith: the total including the bar. Dumbbell (per hand): what one '+
    'dumbbell says. Stacks: the number on the pin. Plates only: what you loaded, sled ignored. '+
    'Bodyweight + added: just the added weight.</div>';
  var sheet=openSheet('<div class="shead"><span class="st">How is it loaded?</span>'+
    '<button class="linkbtn" data-close>Close</button></div><div class="slist next">'+body+'</div>');
  sheet.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.dataset.close!==undefined){ closeSheet(); return; }
    if(b.dataset.pick){ ex.load=b.dataset.pick; saveDraft(); closeSheet(); render(); }
  });
}

function rirSheet(i,j){
  var st=state.draft.exercises[i].sets[j];
  var opts=[["0","failure"],["1","1 left"],["2","2 left"],["3","3 left"],["4","4 left"],["","clear"]];
  var sheet=openSheet('<div class="shead"><span class="st">Reps left in the tank</span>'+
    '<button class="linkbtn" data-close>Close</button></div><div class="rirgrid">'+
    opts.map(function(o,k){
      return '<button data-rir="'+o[0]+'" aria-pressed="'+(st.rir===o[0]&&o[0]!=="")+'" '+
             'style="animation-delay:'+(k*22)+'ms">'+(o[0]===""?"–":o[0])+'<small>'+o[1]+'</small></button>';
    }).join("")+'</div>');
  sheet.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.dataset.close!==undefined){ closeSheet(); return; }
    if(b.dataset.rir!==undefined){ st.rir=b.dataset.rir; saveDraft(); closeSheet(); render(); }
  });
}

/* ========================= toast ========================= */
var toastHost=document.getElementById("toastHost"),toastT=null;
function toast(msg){
  toastHost.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toastT); toastT=setTimeout(function(){toastHost.innerHTML="";},2600);
}

/* ========================= events ========================= */
navEl.addEventListener("click",function(e){
  var b=e.target.closest("button[data-tab]"); if(!b) return;
  if(state.tab===b.dataset.tab) return;
  state.tab=b.dataset.tab; render(true);
});
document.getElementById("themeBtn").addEventListener("click",cycleTheme);

view.addEventListener("input",function(e){
  var el=e.target; if(!el.dataset||!el.dataset.f||!state.draft) return;
  state.draft.exercises[+el.dataset.i].sets[+el.dataset.j][el.dataset.f]=el.value;
  saveDraft();
  var btn=document.querySelector("#savebar .primary");
  if(btn){ var n=countSets(state.draft); btn.disabled=!n;
    btn.innerHTML=n?'Save workout <span class="n">· '+n+' set'+(n===1?"":"s")+'</span>':'Log a set to save'; }
});

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b) return;
  var act=b.dataset.act,i=+b.dataset.i,j=+b.dataset.j,d=state.draft;

  if(act==="startday"){
    var di=document.getElementById("dateIn");
    startSession(b.dataset.day,(di&&di.value)||todayISO()); render(true);
  }
  else if(act==="discard"){
    if(b.dataset.armed){ state.draft=null; saveDraft(); render(true); toast("Workout discarded"); }
    else { b.dataset.armed="1"; b.textContent="Tap again to discard"; }
  }
  else if(act==="pickex"){ exerciseSheet(i); }
  else if(act==="addex"){ exerciseSheet(null); }
  else if(act==="quickadd"){
    var ex=newExercise(b.dataset.name); d.exercises.push(ex); state.justAdded=ex.id; saveDraft(); render();
  }
  else if(act==="pickload"){ loadSheet(i); }
  else if(act==="pickrir"){ rirSheet(i,j); }
  else if(act==="addset"){ d.exercises[i].sets.push(blank()); saveDraft(); render(); }
  else if(act==="delset"){
    if(d.exercises[i].sets.length>1) d.exercises[i].sets.splice(j,1);
    else d.exercises[i].sets[0]=blank();
    saveDraft(); render();
  }
  else if(act==="delex"){
    var card=b.closest(".card");
    if(card&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
      card.classList.add("leaving");
      setTimeout(function(){ d.exercises.splice(i,1); saveDraft(); render(); },210);
    } else { d.exercises.splice(i,1); saveDraft(); render(); }
  }
  else if(act==="toggle"){ state.open[b.dataset.id]=!state.open[b.dataset.id]; render(); }
  else if(act==="delsession"){
    if(b.dataset.armed){
      removeSession(b.dataset.id).then(function(){ render(); toast("Workout deleted"); });
    } else { b.dataset.armed="1"; b.textContent="Tap again to delete"; }
  }
  else if(act==="save"){ saveWorkout(b); }
  else if(act==="export"){ exportBackup(); }
  else if(act==="import"){ document.getElementById("importFile").click(); }
  else if(act==="snooze"){ state.meta.snoozeAt=state.sessions.length; lsSet(META_KEY,state.meta); render(); }
  else if(act==="theme"){ state.theme=b.dataset.theme; lsSet(THEME_KEY,state.theme); applyTheme(); render(); }
});

document.getElementById("importFile").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0]; if(f) importBackup(f); e.target.value="";
});

function saveWorkout(btn){
  var d=state.draft; if(!d) return;
  var clean={id:d.id,date:d.date,day:d.day,createdAt:Date.now(),
    exercises:d.exercises.map(function(e){
      return {name:e.name,muscle:e.muscle,load:e.load,
        sets:e.sets.filter(function(s){return num(s.reps)>0;})
          .map(function(s){return {kg:s.kg===""?"":String(s.kg),reps:String(s.reps),rir:s.rir||""};})};
    }).filter(function(e){return e.sets.length;})};
  if(!clean.exercises.length){ toast("Nothing to save yet"); return; }
  btn.disabled=true; btn.textContent="Saving…";
  persistSession(clean).then(function(){
    state.draft=null; saveDraft(); state.tab="log"; state.open[clean.id]=true;
    render(true); toast("Saved — "+countSets(clean)+" sets logged");
  }).catch(function(){
    btn.disabled=false; toast("Your phone is out of storage — export a backup and delete old workouts");
    render();
  });
}

/* ========================= boot ========================= */
state.theme=lsGet(THEME_KEY,"auto");
if(["auto","light","dark"].indexOf(state.theme)<0) state.theme="auto";
applyTheme();
bootData();
state.draft=lsGet(DRAFT_KEY,null);
if(state.draft&&!Array.isArray(state.draft.exercises)) state.draft=null;
render();
})();
</script>
<script>
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
